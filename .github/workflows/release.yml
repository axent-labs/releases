# AXENT POS's releases (axent-labs/pos, A-010): every hour, and whenever run by hand for a tag, a
# release tag of the private pos that has no release here yet is built into the files a shop
# installs, and published here. This repository holds no source, and its logs are public: no step
# prints the source, only the finished files leave a build, and a release says what each file is
# and how to install it, never the commits behind it, which stay on pos's own releases.
#
# pos is read with a read-only deploy key, the secret POS_DEPLOY_KEY. Nothing is published until
# every file of a release is built: a release is made as a draft, the builds attach their files,
# and it is published last, as a pre-release for a beta and as the latest for a release.
# Publishing is switched on by the repository variable PUBLISH, set to true once the builds are
# in place (P12-M06); until then every release stays a draft, which only the organization sees.

name: Release

on:
  schedule:
    - cron: "23 * * * *" # every hour
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag of axent-labs/pos to build, as v0.2.0; empty for the newest not yet built"
        required: false

permissions:
  contents: write

# One release at a time: an hourly run never starts beside one still building.
concurrency:
  group: release
  cancel-in-progress: false

env:
  POS: git@github.com:axent-labs/pos.git
  QT_VERSION: "6.8.3"
  # Released before this repository built anything: never built on the hour, only when asked.
  BEFORE: "v0.1.0-beta.1 v0.1.0-beta.2 v0.1.0-beta.3 v0.1.0"

jobs:
  find:
    name: Find the tag to build
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      beta: ${{ steps.pick.outputs.beta }}
    steps:
      - name: Read pos's tags, and the releases already here
        id: pick
        env:
          DEPLOY_KEY: ${{ secrets.POS_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pos
          chmod 600 ~/.ssh/pos
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/pos -o IdentitiesOnly=yes"
          tags=$(git ls-remote --tags --refs "$POS" 'v*' | sed 's#.*refs/tags/##' | sort -V)
          made=$(gh release list -R "$GITHUB_REPOSITORY" --limit 500 --json tagName --jq '.[].tagName')
          pick=""
          if [ -n "$ASKED" ]; then
            if ! grep -qx -- "$ASKED" <<<"$tags"; then
              echo "::error::$ASKED is not a tag of axent-labs/pos"
              exit 1
            fi
            if grep -qx -- "$ASKED" <<<"$made"; then
              echo "::error::$ASKED has a release here already; delete it first to build it again"
              exit 1
            fi
            pick="$ASKED"
          else
            # The newest tag with no release here, but for those from before this repository.
            for tag in $(tac <<<"$tags"); do
              grep -qx -- "$tag" <<<"$made" && continue
              [[ " $BEFORE " == *" $tag "* ]] && continue
              pick="$tag"
              break
            done
          fi
          if [ -z "$pick" ]; then
            echo "Nothing to build: every release tag of pos has its release here."
          else
            echo "Building $pick."
          fi
          echo "tag=$pick" >> "$GITHUB_OUTPUT"
          echo "version=${pick#v}" >> "$GITHUB_OUTPUT"
          [[ "$pick" == *-* ]] && echo "beta=true" >> "$GITHUB_OUTPUT" || echo "beta=false" >> "$GITHUB_OUTPUT"

  draft:
    name: Make the release, as a draft
    needs: find
    if: needs.find.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Its draft, with what each file is and how to install it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
          VERSION: ${{ needs.find.outputs.version }}
          BETA: ${{ needs.find.outputs.beta }}
        run: |
          set -euo pipefail
          {
            if [ "$BETA" = "true" ]; then
              echo "A beta of AXENT POS $VERSION, for trying out before its release."
            else
              echo "AXENT POS $VERSION."
            fi
            echo
            echo "| File | For | To install |"
            echo "| --- | --- | --- |"
            echo "| \`axent-pos_${VERSION}_amd64.deb\` | Ubuntu, Debian | \`sudo apt install ./axent-pos_${VERSION}_amd64.deb\` |"
            echo "| \`AXENT-POS-${VERSION}-setup.exe\` | Windows 10 and 11 | Open it; if Windows says the publisher is unknown, choose **More info**, then **Run anyway**. |"
            echo "| \`axent-pos-${VERSION}.apk\` | Android phones and tablets, joining a shop | Open it on the phone, allowing installs from this source when asked. |"
            [ "$BETA" = "true" ] || echo "| \`AXENT-POS-${VERSION}.dmg\` | macOS | Open it and drag AXENT POS to Applications; the first time, right-click the app and choose **Open**. |"
            echo
            echo "Questions: 0701 473 767 | 0111 969 379"
          } > notes.md
          flags=(--draft --title "AXENT POS $VERSION" --notes-file notes.md)
          [ "$BETA" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target main "${flags[@]}"

  # Each build attaches its file to the draft: the .deb and the .exe here, and in time the .apk
  # (P12-M04) and, for a release on main, the .dmg (P12-M05). Each builds the program alone,
  # never the key tool beside it in pos, and refuses to attach anything of the Activator's.

  deb:
    name: The .deb, for Ubuntu and Debian
    needs: [find, draft]
    # The oldest Ubuntu it is for: built there, it installs there and on every one since.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.find.outputs.tag }}
      VERSION: ${{ needs.find.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: releases

      - name: pos, at the tag
        env:
          DEPLOY_KEY: ${{ secrets.POS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # The key and GitHub's host key in the runner's own temporary folder, on any runner.
          key="$RUNNER_TEMP/pos-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o UserKnownHostsFile='$RUNNER_TEMP/known_hosts'" \
            git -c advice.detachedHead=false clone -q --depth 1 --branch "$TAG" "$POS" pos
          rm "$key"

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          # Qt Serial Port, for a receipt printer connected directly (A-003).
          modules: qtserialport
          cache: true

      - name: The libraries Qt and the keychain need
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq ninja-build ccache file libgl1-mesa-dev libegl1 libxkbcommon-dev
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
          libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-xkb1 libfontconfig1-dev libsecret-1-dev
          libwayland-dev > /dev/null

      - name: Build the program alone
        # Into a log that stays on the runner: only what went wrong is shown, never the source.
        run: |
          set -euo pipefail
          cd pos
          cmake --preset linux-release > ../configure.log 2>&1 || { grep -E "CMake Error|error:" ../configure.log | head -20; exit 1; }
          cmake --build --preset linux-release --target ledgry > ../build.log 2>&1 || { grep -E ": (fatal )?error:" ../build.log | head -30; exit 1; }
          test -x build/linux-release/axent
          if [ -e build/linux-release/ledgry-keys ]; then echo "::error::the key tool was built"; exit 1; fi
          echo "Built axent $VERSION."

      - name: The .deb
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          LEDGRY_VERSION: ${{ needs.find.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          releases/packaging/deb.sh pos pos/build/linux-release dist

      - name: Nothing of the Activator in it
        run: |
          set -euo pipefail
          if dpkg-deb -c dist/*.deb | grep -iE "ledgry-keys|activator"; then
            echo "::error::the .deb carries something of the Activator's"
            exit 1
          fi
          dpkg-deb -I dist/*.deb | sed -n '/Package:/,/Depends:/p'

      - name: Attached to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/axent-pos_${VERSION}_amd64.deb -R "$GITHUB_REPOSITORY" --clobber

  exe:
    name: The .exe, for Windows
    needs: [find, draft]
    runs-on: windows-2022
    env:
      TAG: ${{ needs.find.outputs.tag }}
      VERSION: ${{ needs.find.outputs.version }}
    steps:
      - name: pos, at the tag
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.POS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # The key and GitHub's host key in the runner's own temporary folder, on any runner.
          key="$RUNNER_TEMP/pos-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND="ssh -i '$key' -o IdentitiesOnly=yes -o UserKnownHostsFile='$RUNNER_TEMP/known_hosts'" \
            git -c advice.detachedHead=false clone -q --depth 1 --branch "$TAG" "$POS" pos
          rm "$key"

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # Qt Serial Port, for a receipt printer connected directly (A-003).
          modules: qtserialport
          cache: true

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the program alone, and install it with its Qt
        # Into logs that stay on the runner: only what went wrong is shown, never the source.
        shell: pwsh
        run: |
          Set-Location pos
          cmake --preset windows-release *> ..\configure.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path ..\configure.log -Pattern "CMake Error|error" | Select-Object -First 20; exit 1 }
          cmake --build --preset windows-release --target ledgry *> ..\build.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path ..\build.log -Pattern ": (fatal )?error" | Select-Object -First 30; exit 1 }
          if (Test-Path build\windows-release\ledgry-keys.exe) { Write-Error "the key tool was built"; exit 1 }
          # Qt's deploy step takes only an absolute prefix.
          cmake --install build\windows-release --prefix "$PWD\..\stage" *> ..\install.log
          if ($LASTEXITCODE -ne 0) { Select-String -Path ..\install.log -Pattern "error|Error" | Select-Object -First 20; exit 1 }
          Set-Location ..
          # Nothing ships without Qt beside it, and nothing of the Activator's ships at all.
          foreach ($needed in "bin\axent.exe", "bin\Qt6Core.dll", "bin\Qt6Quick.dll", "bin\qt.conf", "plugins\platforms\qwindows.dll", "plugins\sqldrivers\qsqlite.dll") {
            if (-not (Test-Path "stage\$needed")) { Write-Error "The install has no $needed"; exit 1 }
          }
          $activator = Get-ChildItem stage -Recurse | Where-Object { $_.Name -match "ledgry-keys|activator" }
          if ($activator) { $activator | ForEach-Object { $_.FullName }; Write-Error "the install carries something of the Activator's"; exit 1 }
          Write-Output "Built and installed axent $env:VERSION."

      - name: The .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DVersion=$env:VERSION" "/DStaging=$PWD\stage" "/DOutDir=$PWD\dist" pos\packaging\axent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Installed, opened and taken out again
        # As a shop would: installed for everyone, AXENT POS opened on the demo shop, left running
        # a while, its data made where it keeps it, then uninstalled.
        shell: pwsh
        run: |
          $setup = "dist\AXENT-POS-$env:VERSION-setup.exe"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=C:\AXENT-POS" -Wait
          if (-not (Test-Path "C:\AXENT-POS\bin\axent.exe")) { Write-Error "the installer put no axent.exe in place"; exit 1 }
          $app = Start-Process "C:\AXENT-POS\bin\axent.exe" -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Error "AXENT POS stopped by itself, with $($app.ExitCode)"; exit 1 }
          $shop = Join-Path $env:APPDATA "AXENT\AXENT\ledgry-demo.sqlite"
          if (-not (Test-Path $shop)) { Write-Error "AXENT POS made no demo shop at $shop"; exit 1 }
          Stop-Process -Id $app.Id -Force
          Start-Process "C:\AXENT-POS\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Write-Output "Installed, opened on the demo shop for 15 seconds, and uninstalled."

      - name: Attached to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/AXENT-POS-${VERSION}-setup.exe" -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish the release
    needs: [find, draft, deb, exe]
    if: needs.find.outputs.tag != '' && vars.PUBLISH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Published, as the latest or a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
          BETA: ${{ needs.find.outputs.beta }}
        run: |
          set -euo pipefail
          if [ "$BETA" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
